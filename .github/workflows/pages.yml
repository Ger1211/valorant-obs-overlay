name: Publicar overlay en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionar el build (para que OBS tome los cambios solo)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Solo la pagina del overlay: el server y los datos no se publican.
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
